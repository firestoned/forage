---
apiVersion: bindy.firestoned.io/v1beta1
kind: DNSZone
metadata:
  labels:
    bindy.firestoned.io/managed-by: forage
    bindy.firestoned.io/source: named-conf-import
  name: example-com
  namespace: forage-test
spec:
  nameServers:
  - hostname: ns1.example.com.
    ipv4Address: 192.0.2.1
  - hostname: ns2.example.com.
    ipv4Address: 192.0.2.2
  recordsFrom:
  - selector:
      matchLabels:
        bindy.firestoned.io/zone: example.com
  soaRecord:
    adminEmail: hostmaster.example.com.
    expire: 604800
    negativeTtl: 86400
    primaryNs: ns1.example.com.
    refresh: 3600
    retry: 600
    serial: 2026100501
  ttl: 3600
  zoneName: example.com
---
apiVersion: bindy.firestoned.io/v1beta1
kind: DNSZone
metadata:
  labels:
    bindy.firestoned.io/managed-by: forage
    bindy.firestoned.io/source: named-conf-import
  name: example-org
  namespace: forage-test
spec:
  recordsFrom:
  - selector:
      matchLabels:
        bindy.firestoned.io/zone: example.org
  soaRecord:
    adminEmail: admin.example.org.
    expire: 604800
    negativeTtl: 86400
    primaryNs: ns1.example.org.
    refresh: 3600
    retry: 600
    serial: 0
  zoneName: example.org
