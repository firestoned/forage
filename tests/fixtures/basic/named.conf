//
// e2e fixture: one primary zone exercising every record type forage maps,
// and one secondary zone (DNSZone shell only). No `directory` option, so
// zone files resolve against this file's directory. Documentation
// names and addresses only (RFC 2606, RFC 5737, RFC 3849).

zone "example.com" {
    type primary;
    file "db.example.com";
};

zone "example.org" {
    type secondary;
    primaries { 192.0.2.1; };
};
