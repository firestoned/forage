// e2e edge-case fixture (ADR-0003, ADR-0005): the paths the basic fixture
// does not reach, run through the real binary against bindy's CRDs.
// Documentation names and addresses only (RFC 2606, RFC 5737).

options {
    recursion no;
};

// Primary with PTR (skipped), absolute owners, a relative CNAME target and an
// owner long enough that the CR name is truncated.
zone "example.com" {
    type primary;
    file "db.example.com";
};

// Primary without a `file` option: DNSZone shell only.
zone "example.net" {
    type primary;
};

// Primary whose zone file does not exist: warning, DNSZone shell only.
zone "example.org" {
    type primary;
    file "db.does-not-exist";
};

// Zone file with no SOA and no $TTL: placeholder SOA, records still emitted.
zone "example.edu" {
    type primary;
    file "db.example.edu";
};
