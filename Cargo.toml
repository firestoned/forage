[package]
name        = "forage"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.74"
license     = "MIT"
repository  = "https://github.com/firestoned/forage"
homepage    = "https://github.com/firestoned/forage"
description = "Import an existing BIND9 named.conf into a bindy-managed Kubernetes cluster as native CRD resources"
keywords    = ["dns", "bind9", "kubernetes", "bindy", "named-conf"]
categories  = ["command-line-utilities"]
authors     = ["Erick Bourgeois <erick@firestoned.io>"]

[[bin]]
name = "forage"
path = "src/main.rs"

[dependencies]
# BIND9 named.conf + zone file parser
hornet-bind9 = { version = "0.1", features = ["serde"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "color"] }

# YAML / JSON serialization for Kubernetes manifests
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1"

# Error handling
anyhow    = "1"
thiserror = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
