name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # For uploading SARIF results
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  license-check:
    name: Verify SPDX License Headers
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check license headers
        uses: firestoned/github-actions/security/license-check@v1.3.6
        with:
          copyright-holder: "Erick Bourgeois, firestoned"
          license-id: "MIT"

  verify-commits:
    name: Verify Signed Commits
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify all commits are signed
        uses: firestoned/github-actions/security/verify-signed-commits@v1.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/${{ github.base_ref }}
          verify-mode: pr

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@v1.3.6

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    needs: format
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: forage-linux-amd64
            binary_name: forage
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: forage-linux-arm64
            binary_name: forage
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: forage-macos-amd64
            binary_name: forage
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: forage-macos-arm64
            binary_name: forage
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: forage-windows-amd64
            binary_name: forage.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Linux: custom action handles cross-compilation setup for ARM64
      - name: Setup Rust build environment (Linux)
        if: runner.os == 'Linux'
        uses: firestoned/github-actions/rust/setup-rust-build@v1.3.6
        with:
          target: ${{ matrix.platform.target }}

      # macOS/Windows: native build; macOS x86_64 is cross-compiled on ARM64 macos-latest runner
      - name: Setup Rust toolchain (macOS/Windows)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Add x86_64 target for cross-compilation (macOS)
        if: matrix.platform.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo dependencies (macOS/Windows)
        if: runner.os != 'Linux'
        uses: firestoned/github-actions/rust/cache-cargo@v1.3.6

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        uses: firestoned/github-actions/rust/build-binary@v1.3.6
        with:
          target: ${{ matrix.platform.target }}

      - name: Build binary (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Generate SBOM (Linux only)
        if: runner.os == 'Linux'
        uses: firestoned/github-actions/rust/generate-sbom@v1.3.6
        with:
          target: ${{ matrix.platform.target }}

      - name: Upload binary and SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}
            target/${{ matrix.platform.target }}/release/*.cdx.json
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download x86_64 build artifact
        uses: actions/download-artifact@v8
        with:
          name: forage-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@v1.3.6

      - name: Run tests
        run: cargo test --all --verbose

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Run cargo-deny (dependencies, licenses, supply chain)
        run: make cargo-deny

      - name: Run gitleaks (secret scanning)
        run: make gitleaks
